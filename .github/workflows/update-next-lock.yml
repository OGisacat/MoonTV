name: One-shot Next.js lockfile update

on:
  push:
    branches:
      - review/post-migration-2026-09-26

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/post-migration-2026-09-26
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Update Next.js maintenance line
        run: |
          pnpm add --save-exact next@15.5.26
          pnpm add --save-dev --save-exact eslint-config-next@15.5.26
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "security: upgrade Next.js to 15.5.26 [skip lock-update]"
          git push origin HEAD:review/post-migration-2026-09-26
