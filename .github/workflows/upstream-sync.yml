name: Sync upstream LunaTV

on:
  schedule:
    - cron: '9 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply upstream changes without overwriting local customizations
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/MoonTechLab/LunaTV.git 2>/dev/null || \
            git remote set-url upstream https://github.com/MoonTechLab/LunaTV.git
          git fetch --no-tags upstream main

          base_file=".github/upstream-base-sha"
          if [[ ! -f "$base_file" ]]; then
            echo "::error::Missing $base_file; refusing to sync without a known upstream base."
            exit 1
          fi

          base_sha="$(tr -d '[:space:]' < "$base_file")"
          upstream_sha="$(git rev-parse upstream/main)"

          if [[ "$base_sha" == "$upstream_sha" ]]; then
            echo "Already up to date with upstream ${upstream_sha:0:7}."
            exit 0
          fi

          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "::error::Stored upstream base $base_sha is unavailable; refusing to overwrite local changes."
            exit 1
          fi

          patch_file="$(mktemp)"
          git diff --binary --full-index "$base_sha" "$upstream_sha" -- \
            . \
            ':(exclude)public/favicon.ico' \
            ':(exclude)public/logo.png' \
            ':(exclude)public/icons/icon-192x192.png' \
            ':(exclude)public/icons/icon-256x256.png' \
            ':(exclude)public/icons/icon-384x384.png' \
            ':(exclude)public/icons/icon-512x512.png' \
            ':(exclude).github/workflows/upstream-sync.yml' \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude).github/workflows/docker-image.yml' \
            > "$patch_file"

          if [[ -s "$patch_file" ]]; then
            if ! git apply --3way --index "$patch_file"; then
              echo "::error::Upstream changes conflict with MoonTV customizations. Nothing was pushed."
              git status --short
              exit 1
            fi
          fi

          printf '%s\n' "$upstream_sha" > "$base_file"
          git add -A

          if git diff --cached --quiet; then
            echo "No applicable upstream changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync MoonTechLab/LunaTV ${upstream_sha:0:7}"
          git push origin HEAD:main
