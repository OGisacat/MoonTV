name: Sync upstream LunaTV

on:
  schedule:
    - cron: '9 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync MoonTechLab/LunaTV and preserve branding
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/MoonTechLab/LunaTV.git 2>/dev/null ||             git remote set-url upstream https://github.com/MoonTechLab/LunaTV.git
          git fetch --no-tags upstream main

          preserve_dir="$(mktemp -d)"
          mkdir -p "$preserve_dir/public/icons" "$preserve_dir/.github/workflows" "$preserve_dir/.github/patches"

          cp public/favicon.ico "$preserve_dir/public/favicon.ico"
          cp public/logo.png "$preserve_dir/public/logo.png"
          cp public/icons/icon-192x192.png "$preserve_dir/public/icons/icon-192x192.png"
          cp public/icons/icon-256x256.png "$preserve_dir/public/icons/icon-256x256.png"
          cp public/icons/icon-384x384.png "$preserve_dir/public/icons/icon-384x384.png"
          cp public/icons/icon-512x512.png "$preserve_dir/public/icons/icon-512x512.png"
          cp .github/workflows/upstream-sync.yml "$preserve_dir/.github/workflows/upstream-sync.yml"
          cp .github/workflows/ci.yml "$preserve_dir/.github/workflows/ci.yml"
          cp .github/workflows/docker-image.yml "$preserve_dir/.github/workflows/docker-image.yml"
          cp .github/patches/hls-ad-filter.patch "$preserve_dir/.github/patches/hls-ad-filter.patch"

          git rm -r --ignore-unmatch .
          git checkout upstream/main -- .

          # Keep Docker builds deterministic while still taking upstream Dockerfile changes.
          sed -i 's/corepack prepare pnpm@latest --activate/corepack prepare pnpm@10.14.0 --activate/g' Dockerfile

          mkdir -p public/icons .github/workflows .github/patches
          cp "$preserve_dir/public/favicon.ico" public/favicon.ico
          cp "$preserve_dir/public/logo.png" public/logo.png
          cp "$preserve_dir/public/icons/icon-192x192.png" public/icons/icon-192x192.png
          cp "$preserve_dir/public/icons/icon-256x256.png" public/icons/icon-256x256.png
          cp "$preserve_dir/public/icons/icon-384x384.png" public/icons/icon-384x384.png
          cp "$preserve_dir/public/icons/icon-512x512.png" public/icons/icon-512x512.png
          cp "$preserve_dir/.github/workflows/upstream-sync.yml" .github/workflows/upstream-sync.yml
          cp "$preserve_dir/.github/workflows/ci.yml" .github/workflows/ci.yml
          cp "$preserve_dir/.github/workflows/docker-image.yml" .github/workflows/docker-image.yml
          cp "$preserve_dir/.github/patches/hls-ad-filter.patch" .github/patches/hls-ad-filter.patch

          # Reapply the fork-local conservative HLS ad filter. Fail loudly if
          # upstream changed the surrounding code so the patch can be reviewed.
          git apply --check .github/patches/hls-ad-filter.patch
          git apply .github/patches/hls-ad-filter.patch

          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          upstream_sha="$(git rev-parse --short upstream/main)"
          git commit -m "chore: sync MoonTechLab/LunaTV ${upstream_sha}"
          git push origin HEAD:main
